services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agentic -d agentic_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://agentic:agentic@postgres:5432/agentic_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      UPLOAD_ROOT: /app/uploads
      AGENT_PLANNER: ${AGENT_PLANNER:-mock}

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      "

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://agentic:agentic@postgres:5432/agentic_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      UPLOAD_ROOT: /app/uploads
      AGENT_PLANNER: ${AGENT_PLANNER:-mock}

    command: >
      celery
      -A backend.app.celery_app:celery_app
      worker
      --loglevel=info

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    environment:
      API_BASE_URL: http://backend:8000
      COOKIE_PASSWORD: ${COOKIE_PASSWORD}

    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    restart: unless-stopped


volumes:
  postgres_data:
  uploads_data:
